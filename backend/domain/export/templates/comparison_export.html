<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 11pt;
        line-height: 1.6;
        color: #1a1a2e;
        padding: 40px;
      }
      h1 {
        font-size: 18pt;
        color: #4a6fa5;
        border-bottom: 2px solid #4a6fa5;
        padding-bottom: 8px;
        margin-bottom: 12px;
      }
      h2 {
        font-size: 14pt;
        color: #333;
        margin-top: 20px;
        margin-bottom: 8px;
      }
      .papers-list {
        background: #f0f4fb;
        padding: 12px 20px;
        border-radius: 6px;
        margin-bottom: 24px;
      }
      .papers-list li {
        margin-bottom: 4px;
        color: #4a6fa5;
        font-weight: 500;
      }
      .comparison-content {
        white-space: pre-wrap;
        line-height: 1.7;
      }
      .citation {
        font-weight: 600;
        color: #4a6fa5;
      }
      footer {
        margin-top: 40px;
        padding-top: 12px;
        border-top: 1px solid #ddd;
        font-size: 8pt;
        color: #999;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>{{ title }}</h1>

    <h2>Papers Compared</h2>
    <div class="papers-list">
      <ol>
        {% for paper in papers %}
        <li>{{ paper }}</li>
        {% endfor %}
      </ol>
    </div>

    <h2>Comparison</h2>
    <div class="comparison-content">{{ comparison }}</div>

    <footer>
      Generated by Trace-Lit — Intelligent Academic Literature Assistant
    </footer>
  </body>
</html>
