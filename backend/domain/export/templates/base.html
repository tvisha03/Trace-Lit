<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
          font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
          font-size: 11pt;
          line-height: 1.6;
          color: #1a1a2e;
          padding: 40px;
      }
      h1 {
          font-size: 18pt;
          color: #4A6FA5;
          border-bottom: 2px solid #4A6FA5;
          padding-bottom: 8px;
          margin-bottom: 24px;
      }
      {% block extra_styles %}{% endblock %}
    </style>
  </head>
  <body>
    <h1>{% block title %}Trace-Lit Export{% endblock %}</h1>
    {% block content %}{% endblock %}
    <footer
      style="
        margin-top: 40px;
        padding-top: 12px;
        border-top: 1px solid #ddd;
        font-size: 8pt;
        color: #999;
        text-align: center;
      "
    >
      Generated by Trace-Lit — Intelligent Academic Literature Assistant
    </footer>
  </body>
</html>
